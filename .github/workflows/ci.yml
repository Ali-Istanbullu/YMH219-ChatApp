# CI: her push ve pull request'te derle + test et (temiz bir Windows sunucusunda).
# Birim ve smoke testleri basarisizsa build kirmizi olur.
# Smoke testleri GERCEK PostgreSQL kullanir: GitHub'in Windows sunucularinda PostgreSQL hazir kurulu gelir
# (servisi kapali, kullanici postgres / sifre root); burada baslatilip test veritabani olusturulur.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  derle-ve-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Paketleri indir
        run: dotnet restore

      - name: Derle
        run: dotnet build --no-restore -c Release

      - name: Birim testleri
        run: dotnet test tests/ChatApp.UnitTests --no-build -c Release

      - name: PostgreSQL'i baslat ve test veritabanini olustur
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          if (-not $env:PGBIN) {
            $env:PGBIN = (Get-ChildItem "C:\Program Files\PostgreSQL\*\bin" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          $servis = Get-Service -Name postgresql*
          Set-Service -InputObject $servis -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready" -h localhost
          # Test sifresi her calismada rastgele; hicbir yere yazilmaz.
          $sifre = [guid]::NewGuid().ToString("N")
          & "$env:PGBIN\psql" -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE chatapp LOGIN PASSWORD '$sifre'" -c "CREATE DATABASE chatapp OWNER chatapp"
          if ($LASTEXITCODE -ne 0) { throw "Test veritabani olusturulamadi" }
          "CHATAPP_TEST_DB=Host=localhost;Port=5432;Database=chatapp;Username=chatapp;Password=$sifre" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Hazir veritabani testleri de bu PostgreSQL'in programlarini kullanir.
          "CHATAPP_PG_BIN=$env:PGBIN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke testleri (PostgreSQL, hazir veritabani, exe'ler acilip kapaniyor mu)
        run: dotnet test tests/ChatApp.SmokeTests --no-build -c Release

      # Bulut sunucusunun hizi degisken: performans testi kirmizi olsa da build kirilmaz, sonuc ciktida gorunur.
      - name: Performans testleri
        continue-on-error: true
        run: dotnet test tests/ChatApp.PerformanceTests --no-build -c Release --logger "console;verbosity=detailed"
