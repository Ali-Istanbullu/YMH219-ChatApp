# CD: "v" ile baslayan bir etiket (ornek v1.0.0) gonderilince:
# test et -> iki programi yayinla -> PostgreSQL dosyalarini hazirla -> Inno Setup ile iki kurulum exe'si
# -> GitHub Release'e yukle (ChatApp-Kurulum-*.exe, ChatServer-Kurulum-*.exe).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # Release olusturup dosya yukleyebilmek icin

jobs:
  kurulumlari-yayinla:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Birim testleri
        run: dotnet test tests/ChatApp.UnitTests -c Release

      - name: PostgreSQL'i baslat ve test veritabanini olustur
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          if (-not $env:PGBIN) {
            $env:PGBIN = (Get-ChildItem "C:\Program Files\PostgreSQL\*\bin" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          $servis = Get-Service -Name postgresql*
          Set-Service -InputObject $servis -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready" -h localhost
          # Test sifresi her calismada rastgele; hicbir yere yazilmaz.
          $sifre = [guid]::NewGuid().ToString("N")
          & "$env:PGBIN\psql" -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE chatapp LOGIN PASSWORD '$sifre'" -c "CREATE DATABASE chatapp OWNER chatapp"
          if ($LASTEXITCODE -ne 0) { throw "Test veritabani olusturulamadi" }
          "CHATAPP_TEST_DB=Host=localhost;Port=5432;Database=chatapp;Username=chatapp;Password=$sifre" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Hazir veritabani testleri de bu PostgreSQL'in programlarini kullanir.
          "CHATAPP_PG_BIN=$env:PGBIN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Gercek PostgreSQL, hazir veritabani, exe'ler acilip kapaniyor mu: kontrol edilmeden kurulum yayinlanmaz.
      - name: Smoke testleri
        run: dotnet test tests/ChatApp.SmokeTests -c Release

      - name: Yayinla
        run: |
          dotnet publish src/ChatApp.WinForms -c Release -r win-x64 --self-contained false -o publish/ChatApp
          dotnet publish src/ChatApp.Server.WinForms -c Release -r win-x64 --self-contained false -o publish/ChatServer

      # Sunucudaki PostgreSQL farkli surum olabilir; kuruluma her zaman EDB'nin resmi PostgreSQL 18 paketi girer
      # (indirilir ve yanindaki SHA-256 ile dogrulanir).
      - name: PostgreSQL dosyalarini hazirla
        shell: pwsh
        run: ./installer/postgresql-hazirla.ps1

      # Inno Setup yeni Windows sunucu imajlarinda hazir gelmiyor; her seferinde kurulur.
      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: Kurulum exe'lerini derle
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe bulunamadi" }
          foreach ($betik in "installer\ChatApp.iss", "installer\ChatServer.iss") {
            & $iscc.FullName $betik
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi basarisiz: $betik" }
          }

      - name: GitHub Release'e yukle
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
