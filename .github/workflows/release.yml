# CD: "v" ile baslayan bir etiket (ornek v1.0.0) gonderilince:
# test et -> iki programi yayinla -> PostgreSQL dosyalarini hazirla -> Inno Setup ile iki kurulum exe'si
# -> GitHub Release'e yukle (ChatApp-Kurulum-*.exe, ChatServer-Kurulum-*.exe).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # Release olusturup dosya yukleyebilmek icin

jobs:
  kurulumlari-yayinla:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Birim testleri
        run: dotnet test tests/ChatApp.UnitTests -c Release

      - name: Yayinla
        run: |
          dotnet publish src/ChatApp.WinForms -c Release -r win-x64 --self-contained false -o publish/ChatApp
          dotnet publish src/ChatApp.Server.WinForms -c Release -r win-x64 --self-contained false -o publish/ChatServer

      # Sunucudaki PostgreSQL farkli surum olabilir; kuruluma her zaman EDB'nin resmi PostgreSQL 18 paketi girer
      # (indirilir ve yanindaki SHA-256 ile dogrulanir).
      - name: PostgreSQL dosyalarini hazirla
        shell: pwsh
        run: ./installer/postgresql-hazirla.ps1

      # Inno Setup yeni Windows sunucu imajlarinda hazir gelmiyor; her seferinde kurulur.
      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: Kurulum exe'lerini derle
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe bulunamadi" }
          foreach ($betik in "installer\ChatApp.iss", "installer\ChatServer.iss") {
            & $iscc.FullName $betik
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi basarisiz: $betik" }
          }

      - name: GitHub Release'e yukle
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
